name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Emacs ${{ matrix.emacs_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        emacs_version: ['30.1']

    steps:
      - name: Check out
        # actions/checkout v6.0.3 (Node 24)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Emacs ${{ matrix.emacs_version }}
        # purcell/setup-emacs master @ 2026-04-25
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5
        with:
          version: ${{ matrix.emacs_version }}

      - name: Install system tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb socat jq

      - name: Verify tag matches Package-Version (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^;; Package-Version: //p' lisp/emacs-devtools-mcp.el)"
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag does not match Package-Version $ver" >&2
            exit 1
          fi

      - name: make all
        run: make all

      - name: make test-mcp
        run: make test-mcp
